name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão para compilar (ex.: v0.2.0)'
        required: true
        type: string

env:
  APP_VERSION: ${{ inputs.tag }}

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      VITE_APP_VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version tag: $RELEASE_TAG"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Update Ubuntu package indexes
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
      - name: Install native build and playback dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo --preserve-env=DEBIAN_FRONTEND apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            build-essential pkg-config nasm curl wget file unzip patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libfuse2 xvfb xauth dbus-x11 gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Linux Rust compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/debug
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/.fingerprint
          key: linux-ubuntu22-rust-v1-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            linux-ubuntu22-rust-v1-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: npm ci
      - run: npm run setup:tools
      - name: Generate translations before checking frontend
        run: npx --no-install paraglide-js compile --project ./src/project.inlang --outdir ./src/lib/paraglide --strategy localStorage baseLocale --emit-ts-declarations
      - run: npm run check
      - run: npm run test:player
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage
      - name: Fix runtime and repack AppImage
        run: |
          app="$PWD/src-tauri/target/release/bundle/appimage/Open Tunely.AppDir"
          bash scripts/fix-appimage-runtime.sh "$app"
          mkdir -p "$RUNNER_TEMP/appimage-plugin" dist
          cd "$RUNNER_TEMP/appimage-plugin"
          "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage" --appimage-extract > /dev/null
          ARCH=x86_64 squashfs-root/usr/bin/appimagetool "$app" "$GITHUB_WORKSPACE/dist/Open-Tunely-linux-x64.AppImage"
      - name: Check packaged tools and media support
        run: bash scripts/check-appimage.sh dist/Open-Tunely-linux-x64.AppImage
      - name: Check AppImage startup on a virtual display
        run: bash scripts/check-appimage-startup.sh dist/Open-Tunely-linux-x64.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: open-tunely-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: dist/*.AppImage

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version tag: $RELEASE_TAG"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make curl tar diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
      - name: Compile minimal FFmpeg and ffprobe
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - run: npm ci
      - name: Prepare Windows tools and validate conversion
        run: npm run setup:tools
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - run: npm run check
      - run: npm run test:player
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
      - name: Stage Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName dist/Open-Tunely-windows-x64-setup.exe
      - uses: actions/upload-artifact@v6
        with:
          name: open-tunely-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: dist/*-setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          pattern: open-tunely-*
          merge-multiple: true
          path: dist
      - name: Update public rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.tag }}
        run: bash scripts/publish-release.sh dist
